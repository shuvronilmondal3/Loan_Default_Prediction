<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Loan Default Prediction</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <div class="container">
        <h2>Home Loan Default Prediction</h2>
        <form action="{{ url_for('predict') }}" method="post" class="form-box">
            <div class="form-field">
                <label>Loan Amount:</label>
                <input type="number" step="0.01" name="LOAN" required>
            </div>

            <div class="form-field">
                <label>Mortgage Due:</label>
                <input type="number" step="0.01" name="MORTDUE">
            </div>

            <div class="form-field">
                <label>Property Value:</label>
                <input type="number" step="0.01" name="VALUE">
            </div>

            <div class="form-field">
                <label>Reason:</label>
                <select name="REASON">
                    <option value="DebtCon">Debt Consolidation</option>
                    <option value="HomeImp">Home Improvement</option>
                </select>
            </div>

            <div class="form-field">
                <label>Job:</label>
                <select name="JOB">
                    <option value="Office">Office</option>
                    <option value="Sales">Sales</option>
                    <option value="Mgr">Manager</option>
                    <option value="Self">Self</option>
                    <option value="ProfExe">Professional/Executive</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-field">
                <label>Years on Job:</label>
                <input type="number" step="1" name="YOJ">
            </div>

            <div class="form-field">
                <label>Derogatory Reports:</label>
                <input type="number" step="1" name="DEROG">
            </div>

            <div class="form-field">
                <label>Delinquencies:</label>
                <input type="number" step="1" name="DELINQ">
            </div>

            <div class="form-field">
                <label>Age of Oldest Trade Line (months):</label>
                <input type="number" step="1" name="CLAGE">
            </div>

            <div class="form-field">
                <label>Number of Recent Inquiries:</label>
                <input type="number" step="1" name="NINQ">
            </div>

            <div class="form-field">
                <label>Number of Credit Lines:</label>
                <input type="number" step="1" name="CLNO">
            </div>

            <div class="form-field">
                <label>Debt-to-Income Ratio:</label>
                <input type="number" step="0.01" name="DEBTINC">
            </div>

            <div class="form-field">
                <button type="submit" class="submit-btn">Predict</button>
            </div>
        </form>
           {% if prediction_text %}
            <div class="result">
                <h3>{{ prediction_text }}</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
